<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
</head>
<body>
<script>
    var p = new URLSearchParams(window.location.search);
    var v = p.get('v');
    var packageName = 'com.aiphotovideogallery.privatephotogallery';

    // Detect if the user is on an Android device
    var isAndroid = /android/i.test(navigator.userAgent);

    // If Android, use 'market://', otherwise fallback to web URL (for PC/iOS)
    var fallback = isAndroid 
        ? 'market://details?id=' + packageName 
        : 'https://play.google.com/store/apps/details?id=' + packageName;

    if (v) {
        // Try opening the custom app scheme
        window.location.href = 'sg7k://l?v=' + v;

        // Fallback to Play Store if app is not installed
        var timeout = setTimeout(function () {
            window.location.href = fallback;
        }, 2000);

        // Clear timeout if the app opened successfully (prevents redirect when user returns)
        window.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                clearTimeout(timeout);
            }
        });
        window.addEventListener('pagehide', function () {
            clearTimeout(timeout);
        });
    } else {
        window.location.href = fallback;
    }
</script>
</body>
</html>
