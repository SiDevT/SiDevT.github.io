<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #f9f9f9;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #01875f;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <p>Opening application...</p>
    <!-- Fallback button in case browser completely blocks auto-redirection -->
    <a id="actionBtn" class="btn" href="#">Continue to App / Store</a>

<script>
    var p = new URLSearchParams(window.location.search);
    var v = p.get('v') || '';
    var pkg = 'com.aiphotovideogallery.privatephotogallery';

    var isAndroid = /Android/i.test(navigator.userAgent);
    var targetUrl = '';

    if (isAndroid) {
        if (v) {
            // Android Intent: Tries opening 'sg7k://l?v=...', if not installed opens Play Store App directly
            targetUrl = 'intent://l?v=' + encodeURIComponent(v) + '#Intent;scheme=sg7k;package=' + pkg + ';end;';
        } else {
            // Directly launch the Play Store app
            targetUrl = 'intent://details?id=' + pkg + '#Intent;scheme=market;package=com.android.vending;end;';
        }
    } else {
        // Desktop / iOS fallback to web Play Store
        targetUrl = 'https://play.google.com/store/apps/details?id=' + pkg;
    }

    // Set button link for manual click (if auto-redirect is blocked by in-app browsers)
    document.getElementById('actionBtn').href = targetUrl;

    // Trigger auto-redirect immediately
    window.location.replace(targetUrl);
</script>
</body>
</html>
