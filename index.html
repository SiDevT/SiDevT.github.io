<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Gallery...</title>
</head>

<body>

<script>

(function () {

    var params = new URLSearchParams(window.location.search);
    var v = params.get("v");

    var packageName =
        "com.aiphotovideogallery.privatephotogallery";

    // Play Store Android Intent
    var playStoreIntent =
        "intent://details?id=" + packageName +
        "#Intent;" +
        "scheme=market;" +
        "package=com.android.vending;" +
        "end";

    // If no v parameter, directly open Play Store app
    if (!v) {
        window.location.href = playStoreIntent;
        return;
    }

    // Gallery deep link
    var galleryUrl =
        "sg7k://l?v=" + encodeURIComponent(v);

    // Assume app is not opened initially
    var appOpened = false;

    // If page becomes hidden, Android likely opened the Gallery app
    document.addEventListener("visibilitychange", function () {

        if (document.hidden) {
            appOpened = true;
        }

    });

    // Try opening Gallery
    window.location.href = galleryUrl;

    // If Chrome is still visible after timeout,
    // try opening Play Store APP.
    setTimeout(function () {

        if (!appOpened && !document.hidden) {

            window.location.href = playStoreIntent;

        }

    }, 2000);

})();

</script>

</body>
</html>
