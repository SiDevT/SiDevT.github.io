<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body>
<script>
    var params  = new URLSearchParams(window.location.search);
    var code    = params.get('code');
    var store   = 'https://play.google.com/store/apps/details?id=com.aiphotovideogallery.privatephotogallery';

    if (code) {
        // Try open app → myapp://pair?code=ABC123
        window.location.href = 'myapp://pair?code=' + code;

        // App not installed → Play Store after 2 sec
        setTimeout(function() {
            window.location.href = store;
        }, 2000);

    } else {
        // No code → Play Store
        window.location.href = store;
    }
</script>
</body>
</html>
