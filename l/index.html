<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body>

<script>

(function () {

    var p = new URLSearchParams(window.location.search);
    var v = p.get("v");

    var fallback =
        "intent://details?id=" + packageName
        + "#Intent;"
        + "scheme=market;"
        + "package=com.android.vending;"
        + "end";


    if (v) {

        // Try to open Gallery app
        var galleryUrl =
            "sg7k://l?v=" + encodeURIComponent(v);

        window.location.href = galleryUrl;

        // If Gallery did not open, go to Play Store HTTPS
        setTimeout(function () {

            window.location.href = fallback;

        }, 2000);

    } else {

        // No v parameter -> directly open Play Store HTTPS
        window.location.href = fallback;

    }

})();

</script>

</body>
</html>
