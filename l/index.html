<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Gallery...</title>
</head>

<body>

<script>
(function () {

    var p = new URLSearchParams(window.location.search);
    var v = p.get("v");

    var packageName =
        "com.aiphotovideogallery.privatephotogallery";

    var playStoreIntent =
        "intent://details?id=" + packageName +
        "#Intent;scheme=market;package=com.android.vending;end";

    if (!v) {
        window.location.href = playStoreIntent;
        return;
    }

    var appOpened = false;
    var fallbackTimer = null;

    function markAppOpened() {

        appOpened = true;

        if (fallbackTimer) {
            clearTimeout(fallbackTimer);
            fallbackTimer = null;
        }
    }

    document.addEventListener("visibilitychange", function () {

        if (document.visibilityState === "hidden") {
            markAppOpened();
        }

    });

    window.addEventListener("pagehide", function () {
        markAppOpened();
    });


    var deepLink =
        "sg7k://l?v=" + encodeURIComponent(v);

    window.location.href = deepLink;

    fallbackTimer = setTimeout(function () {

        if (!appOpened) {

            window.location.href = playStoreIntent;

        }

    }, 2500);

})();
</script>

</body>
</html>
