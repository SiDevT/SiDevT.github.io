<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Gallery...</title>
</head>
<body>

<script>
    const params = new URLSearchParams(window.location.search);
    const v = params.get("v");

    const playStore =
        "https://play.google.com/store/apps/details?id=com.aiphotovideogallery.privatephotogallery";

    if (!v) {
        window.location.replace(playStore);
    } else {
        const intentUrl =
            "intent://l?v=" + encodeURIComponent(v) +
            "#Intent;" +
            "scheme=sg7k;" +
            "package=com.aiphotovideogallery.privatephotogallery;" +
            "S.browser_fallback_url=" + encodeURIComponent(playStore) +
            ";end";

        window.location.replace(intentUrl);
    }
</script>

</body>
</html>
