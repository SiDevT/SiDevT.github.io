<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Gallery...</title>
</head>

<body>

<script>
(function () {

    var params = new URLSearchParams(window.location.search);
    var v = params.get("v");

    var packageName =
        "com.aiphotovideogallery.privatephotogallery";

    var playStoreApp =
        "market://details?id=" + packageName;

    var playStoreWeb =
        "https://play.google.com/store/apps/details?id=" + packageName;

    if (!v) {

        window.location.href = playStoreApp;
        
        setTimeout(function () {
            window.location.href = playStoreWeb;
        }, 1500);

        return;
    }

    var deepLink =
        "sg7k://l?v=" + encodeURIComponent(v);

    window.location.href = deepLink;

    setTimeout(function () {

        window.location.href = playStoreApp;

        setTimeout(function () {

            window.location.href = playStoreWeb;

        }, 1500);

    }, 2500);

})();
</script>

</body>
</html>
